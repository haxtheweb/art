name: Accessibility

# axe-core scan (WCAG 2.0 and 2.1 A and AA) of what this repo publishes:
# - the hax-art portfolio: every page in hax-art/site.json, built by the
#   command in hax-art/vercel.json (the HAX CLI's site:build-static into
#   hax-art/_static/, the build art.hax.cloud ships), HAX elements from the CDN
# - the interactive pieces listed in .github/a11y/pages.txt
# Pages load only from the site, the HAX CDNs and raw.githubusercontent.com
# (the portfolio shows this repo's art by raw GitHub URL); other third-party
# hosts are blocked so results don't change with services we don't run.
# The baseline files record the violations present when this check was
# added; a pull request fails only when a page gets a new kind of violation
# or more failing elements than its baseline. Fixing things never fails it.
# After fixing, or when a maintainer accepts a finding, refresh a baseline by
# re-running the same command with --update-baseline and commit the file.
on:
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "hax-art/**"
      - ".github/a11y/**"
      - .github/workflows/a11y.yml
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: axe-core (WCAG 2.0/2.1 A and AA)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the scanner
        run: |
          npm ci --prefix .github/a11y --ignore-scripts --no-audit --no-fund
          cd .github/a11y && npx playwright install --with-deps chromium
      - name: Interactive pieces
        if: always()
        run: node .github/a11y/a11y-scan.mjs --root . --pages .github/a11y/pages.txt --allow-hosts raw.githubusercontent.com --baseline .github/a11y/baseline-pieces.json
      - name: Static build of the portfolio (the hax-art/vercel.json build command)
        if: always()
        working-directory: hax-art
        run: sh -c "$(node -p "require('./vercel.json').buildCommand")"
      - name: Portfolio pages
        if: always()
        run: node .github/a11y/a11y-scan.mjs --root hax-art/_static --site-json hax-art/site.json --allow-hosts raw.githubusercontent.com --baseline .github/a11y/baseline-hax-art.json
