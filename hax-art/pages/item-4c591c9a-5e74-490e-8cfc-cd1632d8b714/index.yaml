content: >-
  <p>RPG me is one of the tools of the HAX art movement: a character builder for
  the <code>rpg-character</code>. Pick a base, face, hair, clothes, skin, hat
  and more, and RPG me gives you a seed and a link for the character that stands
  for you across HAX. That character walks in the HAX network bar on every HAX
  site.</p>

  <rpg-character seed="HAX" walking=""></rpg-character>

  <p>RPG me is its own app, at its own address. It lives here because it is part
  of the art; it runs on its own so you can share it, link to it and come back
  to it.</p>

  <simple-cta link="https://rpg-me.hax.cloud/" label="Open RPG me"></simple-cta>

  <ul><li><a href="https://github.com/haxtheweb/rpg-me">rpg-me on
  GitHub</a></li><li><a href="rpg-glitch">RPG Glitch: its links open in RPG
  me</a></li></ul>
