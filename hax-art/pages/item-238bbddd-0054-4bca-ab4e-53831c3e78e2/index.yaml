content: >-
  <media-image
  source="https://raw.githubusercontent.com/haxtheweb/art/main/presentation-materials/episode-xxvi/episode-xxvi-crawl.jpg"
  alt="A starfield with gold text tilted back into space: Episode XXVI, Return
  of the Open Web, the opening of a crawl about HAX in 2026."></media-image>

  <p>A space-opera opening crawl that catches people up on HAX: where it came
  from, the web standards it stands on, and where it is in 2026. It ends on a
  Join the Rebellion card. Viewers with reduced motion get a static, readable
  version.</p>

  <p><em>A parody of the classic sci-fi film opening crawl. The text and the
  synthesized fanfare are original, and no footage, logo or score is
  used.</em></p>

