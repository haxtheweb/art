content: >-
  <p>The Future Traveler has collected the best ideas of every era in his
  backpack, so his icon can be drawn the way each era would have drawn it: an
  1880s engraving, a 1920s gold line drawing, a neon sign, four greens on a
  handheld screen. He is still him in all of them: the helmet with HAX on it,
  the goggles, the lightbulb.</p>

  <media-image
  source="https://raw.githubusercontent.com/haxtheweb/art/main/future-traveler-eras/contact-sheet.jpg"
  alt="The Future Traveler icon in 19 era versions on dark gray, from the icon
  as it ships through engraving, art nouveau, art deco, rainbow, stripes, neon,
  handheld pixels, early web, polygons and terminal, to the 1960s world of
  tomorrow in eight pillar colors." caption="Every era at a
  glance."></media-image>

  <p>These are the eras the Future Traveler remixes through at the right end of
  the HAX network bar: hover him and he tears through every one, click and he
  stays in the next. Each follows one of the styles the <a
  href="posters">posters</a> tell the story of the pillars in, and the world of
  tomorrow comes once per pillar, in that pillar's color.</p>

  <p>The icons are drawn in code (SVG) by Claude, an AI, under HAX team
  direction.</p>

  <ul><li><a
  href="https://github.com/haxtheweb/art/tree/main/future-traveler-eras">SVG and
  PNG files, alt text and the catalog on GitHub</a></li><li><a
