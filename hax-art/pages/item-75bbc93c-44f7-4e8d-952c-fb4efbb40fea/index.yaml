  alt="HAX / THE / WEB in red neon pixel letters, with a light bar over the A
  and bars flanking THE."></media-image>

  <p>A 30-second neon title sequence. Credits tell the HAX story from a napkin
  in 2015 to hundreds of courses while red neon letters drift by, then lock into
  the HAX / THE / WEB mark. Play, pause, scrub, or read every credit as
  text.</p>

  <p><em>A fan homage to the synth-scored opening titles of a 1980s-set TV
  series. The letters, credits and type are HAX's own.</em></p>

