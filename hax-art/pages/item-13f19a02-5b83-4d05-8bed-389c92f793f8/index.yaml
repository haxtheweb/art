content: >-
  <p>Art and media from <a href="https://haxtheweb.org">HAX</a>: open-source
  tools that let anyone create, remix and publish on the web without needing to
  understand the web. This portfolio is itself a HAXsite, built with the HAX
  CLI, and every image on it is pulled straight from the <a
  href="https://github.com/haxtheweb/art">haxtheweb/art</a> repository.</p>

