content: "<media-image source=\"https://raw.githubusercontent.com/haxtheweb/art/main/haxtheweb/posters/social/hax_tomorrow_agnostic_poster.png\" alt=\"1960s travel-poster style: a pixel Future Traveler beside a geodesic sphere, rocket and rainbow on a red planet, tinted Sky Blue. Title &quot;PLATFORM AGNOSTIC&quot;, tagline &quot;Any format, any screen, any browser.&quot;, with a QR code and hax.psu.edu.\"></media-image>\n<ul><li><strong>Series:</strong> World of Tomorrow pillars</li><li><strong>Size:</strong> 1080 × 1350 px</li></ul>\n<p><strong>Review before promoting.</strong> Inspired by 1960s world-of-tomorrow and space travel posters; reviewed and kept, November 2026. See <a href=\"https://github.com/haxtheweb/art/blob/main/LICENSING.md\">LICENSING.md</a>.</p>\n<p>See the Platform Agnostic pillar in action in its 42-second stage video, recorded on the live haxtheweb.org.</p>\n<ul><li><a href=\"https://raw.githubusercontent.com/haxtheweb/art/main/haxtheweb/posters/social/hax_tomorrow_agnostic_poster.png\">Full-size still</a></li><li><a href=\"https://github.com/haxtheweb/art/releases/download/media-2026-11/hax_tomorrow_agnostic.mp4\">Video (MP4)</a></li><li><a href=\"https://github.com/haxtheweb/art/releases/download/media-2026-11/hax_tomorrow_agnostic.gif\">GIF</a></li><li><a href=\"https://github.com/haxtheweb/art/releases/download/media-2026-11/hax_campus_tomorrow_agnostic.pdf\">11×17 print (PDF)</a></li><li><a href=\"https://github.com/haxtheweb/art/releases/download/media-2026-11/hax_stage_agnostic_full.mp4\">Platform Agnostic stage video (MP4)</a></li><li><a href=\"https://github.com/haxtheweb/art/blob/main/haxtheweb/posters/social/hax_tomorrow_agnostic_poster.png\">View on GitHub</a></li></ul>"
