content: >-
  <p>The Future Traveler, HAX's official mascot, traveled to the future to bring
  our ideas to life. He moves through time, taking the best ideas of every era
  and carrying them into the future, where data flows like water. He is a
  variant of the <code>rpg-character</code>, itself a caricature of HAX's
  creator.</p>

  <p>He is on-model when he has a red helmet with a HAX visor band, steampunk
  goggles, a lightbulb on a stalk and a green backpack. The variants change the
  style and the setting, never those features. Filter the grid below by
  role.</p>

