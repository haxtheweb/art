  <p>A Halloween arcade title screen starring the rpg-character's zombie pirate
  girl (the element's zpg seed). Type cheat codes, ask Merlin, or press start to
  drop into a real HAXcms site and edit it.</p>

  <p><em>A homage to the title screen of a 1990s light-gun zombie arcade game.
  Its art, audio and text are all original.</em></p>

