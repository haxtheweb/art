content: "<p>RPG me is one of the tools of the HAX art movement: a character builder for the <code>rpg-character</code>. Pick a base, face, hair, clothes, skin, hat and more, and RPG me gives you a character code and a link that rebuild the character that stands for you across HAX, on any page that loads HAX.</p>\n<rpg-character seed=\"HAX\" walking=\"\"></rpg-character>\n<p>RPG me is its own app, at its own address: rpg.art.hax.cloud. It lives here because it is part of the art; it runs on its own so you can share it, link to it and come back to it. Its old address, rpg-me.hax.cloud, takes you there.</p>\n<simple-cta link=\"https://rpg.art.hax.cloud/\" label=\"Open RPG me\"></simple-cta>\n<ul><li><a href=\"https://github.com/haxtheweb/rpg-me\">rpg-me on GitHub</a></li><li><a href=\"rpg-glitch\">RPG Glitch: its links open in RPG me</a></li></ul>"
