<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG Glitch</title>
<meta name="description" content="Glitch your way through rpg-character remixes on an 80s CRT. Every click is a new character with a link you can share.">
<meta property="og:title" content="RPG Glitch: the future is remixable">
<meta property="og:description" content="An rpg-character glitching between versions of itself on an 80s CRT. Click for a new one, then share the link.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://raw.githubusercontent.com/haxtheweb/art/main/haxtheweb/rpg-glitch/media/rpg-glitch-still.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap">
<style>
/* DDD base palette and spacing; the scene itself uses its own CRT palette (cyan, magenta, yellow on near-black). */
:root {
  --ddd-theme-default-nittanyNavy: #001e44;
  --ddd-theme-default-potentialMidnight: #000321;
  --ddd-theme-default-limestoneGray: #a2aaad;
  --ddd-theme-default-limestoneLight: #e4e5e7;
  --ddd-theme-default-white: #ffffff;
  --ddd-theme-default-skyBlue: #009cde;
  --ddd-theme-default-keystoneYellow: #ffd100;
  --ddd-font-primary: "Roboto", "Franklin Gothic Medium", Tahoma, sans-serif;
  --ddd-font-mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --ddd-spacing-2: 8px;
  --ddd-spacing-3: 12px;
  --ddd-spacing-4: 16px;
  --ddd-spacing-6: 24px;
  --ddd-radius-sm: 4px;
  --ddd-radius-md: 8px;
  --crt-bg: #0b0b12;
  --crt-cyan: #22e4ff;
  --crt-magenta: #ff2e88;
  --page-bg: var(--ddd-theme-default-potentialMidnight);
  --page-fg: var(--ddd-theme-default-limestoneLight);
  --page-muted: var(--ddd-theme-default-limestoneGray);
  --control-bg: #0d1630;
  --control-border: #2a3a66;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page-bg);
  color: var(--page-fg);
  font-family: var(--ddd-font-primary);
  line-height: 1.5;
}
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--ddd-spacing-6) var(--ddd-spacing-4);
}
h1 {
  font-family: var(--ddd-font-mono);
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 var(--ddd-spacing-4);
  color: var(--ddd-theme-default-white);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.screen {
  position: relative;
  border-radius: var(--ddd-radius-md);
  overflow: hidden;
  border: 2px solid var(--control-border);
  background: var(--crt-bg);
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  cursor: pointer;
  image-rendering: pixelated;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ddd-spacing-3);
  align-items: center;
  margin-top: var(--ddd-spacing-4);
}
.seed {
  font-family: var(--ddd-font-mono);
  font-size: 15px;
  padding: var(--ddd-spacing-2) var(--ddd-spacing-3);
  border-radius: var(--ddd-radius-sm);
  background: var(--control-bg);
  border: 1px solid var(--control-border);
  color: var(--crt-cyan);
}
button, select, a.btn, label.toggle {
  font: inherit;
  font-size: 15px;
  color: var(--page-fg);
  background: var(--control-bg);
  border: 1px solid var(--control-border);
  border-radius: var(--ddd-radius-sm);
  padding: var(--ddd-spacing-2) var(--ddd-spacing-3);
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--ddd-spacing-2);
}
button:hover, select:hover, a.btn:hover, label.toggle:hover { border-color: var(--crt-cyan); }
button.primary {
  background: var(--crt-magenta);
  border-color: var(--crt-magenta);
  color: var(--ddd-theme-default-white);
  font-weight: 700;
}
:focus-visible {
  outline: 3px solid var(--ddd-theme-default-keystoneYellow);
  outline-offset: 2px;
}
.spacer { flex: 1; }
.status { min-height: 1.5em; margin-top: var(--ddd-spacing-3); color: var(--page-muted); font-size: 14px; }
footer { margin-top: var(--ddd-spacing-6); color: var(--page-muted); font-size: 14px; }
footer a, .status a { color: var(--ddd-theme-default-skyBlue); }
</style>
</head>
<body>
<main>
  <h1>rpg_glitch</h1>
  <div class="screen">
    <canvas id="scene" width="1360" height="880" role="img" aria-label="Loading rpg-character"></canvas>
  </div>
  <div class="controls" aria-label="Character controls">
    <button class="primary" id="remix" type="button">Remix</button>
    <span class="seed" id="seedLabel">seed: --------</span>
    <label class="sr-only" for="hat">Hat</label>
    <select id="hat"></select>
    <label class="toggle"><input type="checkbox" id="fire"> On fire</label>
    <button id="pause" type="button" aria-pressed="false">Pause glitch</button>
    <span class="spacer"></span>
    <button id="copy" type="button">Copy link</button>
    <button id="shareX" type="button">Share on X</button>
    <button id="shareLinkedIn" type="button">Share on LinkedIn</button>
    <a class="btn" id="rpgme" href="https://rpg-me.hax.cloud/">Edit in rpg-me</a>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <footer>
    Click the screen or press Remix for a new character. Every character has its own link, and the link opens the same character in <a href="https://github.com/haxtheweb/rpg-me">rpg-me</a>.
    Made for <a href="https://haxtheweb.org">HAXTheWeb</a> with the <a href="https://github.com/haxtheweb/webcomponents/tree/main/elements/rpg-character">rpg-character</a> element's own art. Source: <a href="https://github.com/haxtheweb/art/tree/main/haxtheweb/rpg-glitch">haxtheweb/art</a>.
  </footer>
</main>
<script>
(function () {
  "use strict";
  /* ---------- character model (same traits and seed rules as rpg-character and rpg-me) ---------- */
  var ART = "rpg-character/";
  var HATS = ["none", "party", "bunny", "coffee", "construction", "cowboy", "education", "knight", "ninja", "pirate", "watermelon"];
  var CHAR_BUILDER = ["accessories", "base", "leg", "face", "faceItem", "hair", "pants", "shirt", "skin", "hatColor"];
  var FUN_KEYS = { zpg: "7501517984378880262144", edtechjoker: "712215550", btopro: "7122155501" };
  // rpg-me's 8-digit seed order
  var RPG_ME_ORDER = ["base", "face", "faceItem", "hair", "pants", "shirt", "skin", "hatColor"];
  var SHARE_TEXT = "Check out my glitched RPG character, brought to the world by";

  function rnd(n) { return Math.floor(Math.random() * n); }
  function clampTrait(k, v) {
    v = parseInt(v, 10);
    if (isNaN(v) || v < 0) { v = 0; }
    if (k === "base") { return v >= 1 ? 1 : 0; }
    if (k === "face") { return v > 5 ? 5 : v; }
    return v > 9 ? 9 : v;
  }
  // rpg-character's seed-to-traits logic, for word seeds like "btopro"
  function traitsFromWord(word) {
    var s = 54;
    for (var i = 0; i < word.length && i < 64; i++) { s *= word.charCodeAt(i); }
    var d = FUN_KEYS[word] || BigInt(s).toString();
    var t = {};
    CHAR_BUILDER.forEach(function (k, i) {
      if (k === "leg") { return; }
      var v = d[i] !== undefined ? parseInt(d[i], 10) : 0;
      if (k === "base") { t[k] = v >= 5 ? 1 : 0; }
      else if (k === "face") { t[k] = v > 5 ? 1 : v; }
      else { t[k] = v; }
    });
    return t;
  }
  // rpg-me's numeric seed: one digit per trait, left-padded to 8
  function traitsFromDigits(seed) {
    var p = seed.padStart(8, "0").slice(0, 8), t = { accessories: 0 };
    RPG_ME_ORDER.forEach(function (k, i) { t[k] = clampTrait(k, p[i]); });
    return t;
  }
  function digits(t) { return RPG_ME_ORDER.map(function (k) { return t[k]; }).join(""); }
  function randomCharacter() {
    var t = { accessories: rnd(10), base: rnd(2), face: rnd(6), faceItem: rnd(10), hair: rnd(10), pants: rnd(10), shirt: rnd(10), skin: rnd(10), hatColor: rnd(10) };
    return { word: null, t: t, hat: HATS[rnd(HATS.length)], fire: Math.random() < 0.15 };
  }
  function fromQuery(search) {
    var q = new URLSearchParams(search);
    if (!q.has("seed")) { return null; }
    var seed = q.get("seed").trim(), c = { word: null, t: null, hat: "none", fire: q.get("fire") === "true" };
    if (/^\d+$/.test(seed)) {
      c.t = traitsFromDigits(seed);
      if (q.has("accessories")) { c.t.accessories = clampTrait("accessories", q.get("accessories")); }
    } else if (seed) {
      c.word = seed.slice(0, 64);
      c.t = traitsFromWord(c.word);
    } else { return null; }
    var hat = q.get("hat");
    if (hat === "random") { hat = HATS[rnd(HATS.length)]; }
    c.hat = HATS.indexOf(hat) !== -1 ? hat : "none";
    return c;
  }
  function params(c, forRpgMe) {
    var p = new URLSearchParams();
    p.set("seed", c.word && !forRpgMe ? c.word : digits(c.t));
    p.set("hat", c.hat);
    if (c.fire) { p.set("fire", "true"); }
    if (!forRpgMe && !c.word && c.t.accessories) { p.set("accessories", String(c.t.accessories)); }
    return p.toString();
  }
  function shareURL(c) { return location.origin + location.pathname + "?" + params(c, false); }
  // the element's draw order (rpg-character render())
  function layers(c, hatOverride) {
    var t = c.t, hat = hatOverride || c.hat;
    if (c.fire && hat === "none") { hat = "coffee"; }
    return [
      "skin/" + t.skin,
      t.base === 1 ? "hair/" + t.hair : null,
      "face/" + t.face,
      "faceItem/" + t.faceItem,
      "shirt/" + t.shirt,
      "pants/" + t.pants,
      "accessories/" + t.accessories,
      "base/" + t.base,
      "hatColor/" + t.hatColor,
      c.fire ? "base/fire" : null,
      hat !== "none" ? "hat/" + hat : null
    ].filter(Boolean);
  }

  /* ---------- sprite building ---------- */
  var IMG = {};
  function load(p) {
    if (IMG[p]) { return Promise.resolve(); }
    return new Promise(function (resolve) {
      var i = new Image();
      i.onload = function () { IMG[p] = i; resolve(); };
      i.onerror = resolve;
      i.src = ART + p + ".svg";
    });
  }
  function canvas(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function tint(src, col) {
    var c = canvas(113, 142), g = c.getContext("2d");
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = col;
    g.fillRect(0, 0, 113, 142);
    return c;
  }
  function sprite(c, hatOverride) {
    var list = layers(c, hatOverride);
    return Promise.all(list.map(load)).then(function () {
      var n = canvas(113, 142), g = n.getContext("2d");
      list.forEach(function (p) { if (IMG[p]) { g.drawImage(IMG[p], 0, 0, 113, 142); } });
      return { n: n, cy: tint(n, "#22e4ff"), mg: tint(n, "#ff2e88") };
    });
  }

  /* ---------- scene ---------- */
  var C = document.getElementById("scene"), x = C.getContext("2d");
  var W = 680, H = 440, S = C.width / W, R = Math.random;
  var GLITCH_MS = 300, HOLD_MS = 4200;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused = reduceMotion;
  var ch = null, cur = null, prv = null, err = null, alts = [], pending = null, gT = -1e9, settle = true;

  var bg = canvas(C.width, C.height);
  (function paintBackground() {
    var b = bg.getContext("2d");
    b.scale(S, S);
    b.fillStyle = "#0b0b12"; b.fillRect(0, 0, W, H);
    var stars = ["#f4f4f8", "#22e4ff", "#f5e663", "#ff2e88"];
    for (var i = 0; i < 110; i++) { b.fillStyle = stars[i % 4]; var s = i % 7 ? 2 : 4; b.fillRect((i * 137) % W, (i * 71) % 250, s, s); }
    b.fillStyle = "#ff2e88";
    for (var y = 0; y < 90; y += 6) { var w = Math.sqrt(Math.max(0, 8100 - (90 - y) * (90 - y))); b.fillRect(340 - w, 150 + y, w * 2, y % 12 ? 4 : 2); }
    for (var a = 0; a < W; a += 8) { var h1 = 120 + 45 * Math.sin(a * 0.013) + 25 * Math.sin(a * 0.05); b.fillStyle = "#13132a"; b.fillRect(a, 330 - h1, 8, h1); }
    for (var a2 = 0; a2 < W; a2 += 8) { var h2 = 60 + 30 * Math.sin(a2 * 0.021 + 2) + 15 * Math.sin(a2 * 0.09); b.fillStyle = "#1d1d3d"; b.fillRect(a2, 330 - h2, 8, h2); }
    b.fillStyle = "#140a22"; b.fillRect(0, 330, W, 110);
    b.fillStyle = "#ff2e88"; b.fillRect(0, 329, W, 2);
    b.strokeStyle = "rgba(255,46,136,0.5)"; b.lineWidth = 1;
    for (var k = 1; k < 10; k++) { var gy = 330 + k * k * 1.2; if (gy > H) { break; } b.beginPath(); b.moveTo(0, gy); b.lineTo(W, gy); b.stroke(); }
    for (var v = -14; v <= 14; v++) { b.beginPath(); b.moveTo(340 + v * 12, 330); b.lineTo(340 + v * 95, H); b.stroke(); }
  })();
  var scan = canvas(C.width, C.height);
  (function paintScanlines() {
    var g = scan.getContext("2d");
    g.fillStyle = "rgba(0,0,0,0.38)";
    for (var y = 0; y < C.height; y += 3 * S) { g.fillRect(0, y, C.width, S); }
  })();
  var tmp = canvas(C.width, C.height), tg = tmp.getContext("2d");
  var pc = canvas(113, 142), pg = pc.getContext("2d");
  function grab() { tg.clearRect(0, 0, tmp.width, tmp.height); tg.drawImage(C, 0, 0); }
  function copy(sx, sy, sw, sh, dx, dy) {
    if (sw <= 0 || sh <= 0) { return; }
    x.drawImage(tmp, sx * S, sy * S, sw * S, sh * S, dx, dy, sw, sh);
  }
  function pixelate(src, block) {
    var w = Math.max(4, Math.round(113 / block)), h = Math.max(5, Math.round(142 / block));
    pg.imageSmoothingEnabled = true;
    pg.clearRect(0, 0, 113, 142);
    pg.drawImage(src, 0, 0, w, h);
    return [w, h];
  }
  function caption(jitter) {
    x.textAlign = "center";
    x.font = "bold 32px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace";
    [["#22e4ff", -2 - jitter], ["#ff2e88", 2 + jitter], ["#f4f4f8", 0]].forEach(function (l) {
      x.fillStyle = l[0]; x.fillText("hax_the_web", 340 + l[1], 392);
    });
    x.font = "15px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace";
    x.fillStyle = "#22e4ff";
    x.fillText("// the future is remixable", 340, 420);
    x.textAlign = "left";
  }
  function frame(now) {
    var e = now - gT;
    if (pending && e >= GLITCH_MS) { gT = now - GLITCH_MS + 40; e = GLITCH_MS - 40; }
    var gl = !paused && e >= 0 && e < GLITCH_MS;
    var p = Math.min(1, Math.max(0, e / GLITCH_MS)), k = gl ? 1 - p * 0.6 : 0;
    if (!paused && ch && !pending && e > HOLD_MS) { echo(); }
    x.setTransform(S, 0, 0, S, 0, 0);
    x.imageSmoothingEnabled = false;
    x.drawImage(bg, 0, 0, W, H);
    var sc = 2, w = 113 * sc, h = 142 * sc, sx = 227, sy = 52;
    if (cur) {
      var to = cur, from = settle ? (prv || cur) : cur;
      if (!gl) {
        x.globalAlpha = 0.35; x.drawImage(to.cy, sx - 2, sy, w, h); x.drawImage(to.mg, sx + 2, sy, w, h);
        x.globalAlpha = 1; x.drawImage(to.n, sx, sy, w, h);
      } else if (R() < 0.3) {
        var pick = R() < p ? to : (settle ? from : alts[rnd(alts.length)] || to);
        var d = pixelate(pick.n, 3 + Math.floor(R() * 8 * k));
        x.globalAlpha = 0.7; x.drawImage(pc, 0, 0, d[0], d[1], sx - 12 * k, sy, w, h);
        x.globalAlpha = 1; x.drawImage(pc, 0, 0, d[0], d[1], sx + (R() - 0.5) * 40 * k, sy, w, h);
      } else {
        var yy = 0;
        while (yy < 142) {
          var sh = Math.min(142 - yy, 3 + Math.floor(R() * 16));
          var src;
          if (err && R() < 0.15) { src = err; }
          else if (R() < p) { src = to; }
          else { src = settle ? from : (alts[rnd(alts.length)] || to); }
          var dx = (R() - 0.5) * 180 * k, sp = 6 + 28 * k;
          x.globalAlpha = 0.75;
          x.drawImage(src.cy, 0, yy, 113, sh, sx + dx - sp, sy + yy * sc, w, sh * sc);
          x.drawImage(src.mg, 0, yy, 113, sh, sx + dx + sp, sy + yy * sc, w, sh * sc);
          x.globalAlpha = 1;
          x.drawImage(src.n, 0, yy, 113, sh, sx + dx, sy + yy * sc, w, sh * sc);
          yy += sh;
        }
      }
    }
    caption(gl ? Math.floor(k * 8) : 0);
    if (gl) {
      grab();
      var tears = 3 + Math.floor(R() * 7 * k);
      for (var i = 0; i < tears; i++) { var ty = Math.floor(R() * H), th = 2 + Math.floor(R() * 36 * k); copy(0, ty, W, Math.min(th, H - ty), (R() - 0.5) * 140 * k, ty); }
      var blocks = Math.floor(R() * 6 * k);
      for (var j = 0; j < blocks; j++) { var bw = 20 + R() * 110, bh = 6 + R() * 36, ax = R() * (W - bw), ay = R() * (H - bh); copy(ax, ay, bw, bh, ax + (R() - 0.5) * 160, ay + (R() - 0.5) * 40); }
      if (R() < 0.3) { x.globalCompositeOperation = "difference"; x.fillStyle = R() < 0.5 ? "#22e4ff" : "#ff2e88"; x.fillRect(0, R() * H, W, 8 + R() * 50); x.globalCompositeOperation = "source-over"; }
      for (var n = 0; n < 1600 * k; n++) { var gr = Math.floor(R() * 255); x.fillStyle = "rgba(" + gr + "," + gr + "," + gr + ",0.55)"; x.fillRect(R() * W, R() * H, 2, 2); }
      var lines = 2 + Math.floor(R() * 4);
      for (var l = 0; l < lines; l++) { var ly = R() * H; x.fillStyle = "rgba(34,228,255,0.5)"; x.fillRect(-3, ly, W, 2); x.fillStyle = "rgba(255,46,136,0.5)"; x.fillRect(3, ly + 1, W, 2); x.fillStyle = "rgba(255,255,255,0.7)"; x.fillRect(0, ly, W, 2); }
    }
    if (!paused) { var ry = (now / 30) % (H + 90) - 45; x.fillStyle = "rgba(255,255,255,0.035)"; x.fillRect(0, ry, W, 45); }
    x.drawImage(scan, 0, 0, W, H);
    x.fillStyle = "rgba(0,0,0,0.3)"; x.fillRect(0, 0, W, 6); x.fillRect(0, H - 6, W, 6); x.fillRect(0, 0, 6, H); x.fillRect(W - 6, 0, 6, H);
  }

  /* ---------- state changes ---------- */
  var seedLabel = document.getElementById("seedLabel"), hatSel = document.getElementById("hat"), fireBox = document.getElementById("fire");
  var status = document.getElementById("status"), rpgme = document.getElementById("rpgme");
  HATS.forEach(function (h) { var o = document.createElement("option"); o.value = h; o.textContent = "Hat: " + h; hatSel.appendChild(o); });

  function describe(c) {
    return "rpg-character, seed " + (c.word || digits(c.t)) + ", " + (c.hat === "none" ? "no hat" : c.hat + " hat") + (c.fire ? ", on fire" : "");
  }
  function syncUI(c) {
    seedLabel.textContent = "seed: " + (c.word || digits(c.t));
    hatSel.value = c.hat;
    fireBox.checked = !!c.fire;
    rpgme.href = "https://rpg-me.hax.cloud/?" + params(c, true);
    C.setAttribute("aria-label", describe(c) + ". Activate to remix.");
    history.replaceState(null, "", "?" + params(c, false));
  }
  function loadAlts(c) {
    var others = HATS.filter(function (h) { return h !== c.hat; });
    var picks = [others[rnd(others.length)], others[rnd(others.length)]];
    Promise.all(picks.map(function (h) { return sprite(c, h); })).then(function (s) { if (ch === c) { alts = s; } });
    sprite(c, "error").then(function (s) { if (ch === c) { err = s; } });
  }
  // glitch into a new character (or new hat or fire state)
  function become(c, announce) {
    settle = true;
    gT = performance.now();
    var job = sprite(c).then(function (s) {
      if (pending !== job) { return; }
      prv = cur; cur = s; ch = c; pending = null;
      alts = []; loadAlts(c);
      if (paused) { frame(gT + GLITCH_MS + 10); }
    });
    pending = job;
    syncUI(c);
    if (announce) { status.textContent = "New character: " + describe(c) + "."; }
  }
  // periodic glitch through other versions of the same character, landing back on it
  function echo() {
    settle = false;
    gT = performance.now();
  }
  function remix() { become(randomCharacter(), true); }

  C.addEventListener("click", remix);
  document.getElementById("remix").addEventListener("click", remix);
  hatSel.addEventListener("change", function () { if (ch) { become({ word: ch.word, t: ch.t, hat: hatSel.value, fire: ch.fire }, true); } });
  fireBox.addEventListener("change", function () { if (ch) { become({ word: ch.word, t: ch.t, hat: ch.hat, fire: fireBox.checked }, true); } });
  var pauseBtn = document.getElementById("pause");
  function setPaused(v) {
    paused = v;
    pauseBtn.setAttribute("aria-pressed", v ? "true" : "false");
    pauseBtn.textContent = v ? "Play glitch" : "Pause glitch";
    if (v) { frame(gT + GLITCH_MS + 10); } else { requestAnimationFrame(loop); }
  }
  pauseBtn.addEventListener("click", function () { setPaused(!paused); });
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) { return navigator.clipboard.writeText(t); }
    return Promise.reject(new Error("no clipboard"));
  }
  document.getElementById("copy").addEventListener("click", function () {
    var u = shareURL(ch);
    copyText(u).then(function () { status.textContent = "Link copied."; }, function () { status.textContent = "Copy this link: " + u; });
  });
  document.getElementById("shareX").addEventListener("click", function () {
    window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(SHARE_TEXT + " @HAXTheWeb") + "&url=" + encodeURIComponent(shareURL(ch)), "_blank", "noopener");
  });
  document.getElementById("shareLinkedIn").addEventListener("click", function () {
    window.open("https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(shareURL(ch)), "_blank", "noopener");
  });

  var manual = false;
  function loop(t) {
    if (paused || manual) { return; }
    frame(t);
    requestAnimationFrame(loop);
  }
  var start = fromQuery(location.search) || { word: "btopro", t: traitsFromWord("btopro"), hat: "none", fire: false };
  pauseBtn.textContent = paused ? "Play glitch" : "Pause glitch";
  pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
  become(start, false);
  if (paused) { frame(0); } else { requestAnimationFrame(loop); }
  // expose for the media renderer in tools/
  window.rpgGlitch = {
    ready: function () { return !!cur && !pending && alts.length > 0 && !!err; },
    becomeFromQuery: function (qs) { var c = fromQuery(qs); if (c) { become(c, false); } },
    remix: remix,
    // take over the clock: render the scene at a given offset (ms) into a glitch
    manual: function () { manual = true; },
    glitch: function (echoOnly) { if (echoOnly) { echo(); } gT = performance.now(); return gT; },
    renderAt: function (offset) { frame(gT + offset); },
    url: function () { return shareURL(ch); }
  };
})();
</script>
